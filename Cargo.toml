[workspace]
resolver = "3"
members = [
    "crates/tuxhello-proto",
    "crates/tuxhello-client",
    "crates/tuxhello-policy",
    "crates/tuxhello-store",
    "crates/tuxhello-daemon",
    "crates/pam-tuxhello",
    "crates/tuxhello-cli",
    "crates/tuxhello-pam-setup",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/prashlkam/tux-hello"
authors = ["Tux Hello contributors"]

[workspace.dependencies]
tuxhello-proto = { path = "crates/tuxhello-proto" }
tuxhello-client = { path = "crates/tuxhello-client" }
tuxhello-policy = { path = "crates/tuxhello-policy" }
tuxhello-store = { path = "crates/tuxhello-store" }

clap = { version = "4.5", features = ["derive"] }
dbus = "0.9"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = ["user"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep unwinding: the PAM module catches panics so that a bug can never crash
# the host process (sudo, the greeter, the screen locker).
panic = "unwind"

# Crypto is unbearably slow unoptimised (Argon2 with 64 MiB takes seconds),
# which makes debug builds and timing-based tests flaky. Optimise just these.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
