<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- D-Bus system bus policy for tuxhellod. -->
<busconfig>
  <!-- Only the daemon's account (and root, for tests/debugging) may own the name. -->
  <policy user="tuxhello">
    <allow own="org.tuxhello.Auth1"/>
  </policy>
  <policy user="root">
    <allow own="org.tuxhello.Auth1"/>
  </policy>

  <!-- Anyone may call it: the daemon itself checks who is asking (a caller can
       only authenticate as itself unless it is root). -->
  <policy context="default">
    <allow send_destination="org.tuxhello.Auth1"
           send_interface="org.tuxhello.Auth1"/>
    <allow send_destination="org.tuxhello.Auth1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.tuxhello.Auth1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
