[package]
name = "tuxhello-daemon"
description = "Tux Hello system daemon (tuxhellod)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tuxhellod"
path = "src/main.rs"

[features]
default = ["fido2", "tpm"]
# Real FIDO2/U2F security keys through libfido2.
fido2 = []
# TPM 2.0 through tpm2-tss: seals the store's master key and backs the PIN.
tpm = ["tuxhello-store/tpm"]
# Test-only backends: the stub (outcome set in the config file) and a software
# FIDO2 authenticator. Never enable this in distribution packages: with
# `outcome = "success"` the stub authenticates anyone.
stub-backend = []

[dependencies]
argon2 = "0.5"
clap.workspace = true
ed25519-dalek = "2"
env_logger.workspace = true
futures-util = { version = "0.3", default-features = false }
log.workspace = true
nix.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
tuxhello-policy.workspace = true
tuxhello-proto.workspace = true
tuxhello-store.workspace = true
zbus.workspace = true
zeroize = "1"
